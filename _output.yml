bookdown::gitbook:
  css: style.css
  split_by: chapter
  includes:
    in_header: google-analytics.html
  config:
    toc:
      before: |
        <li><a href="./">Book of Economics</a></li>
      after: |
        <li><a href="https://bookdown.org" target="blank">Published with bookdown</a></li>
    edit: null
    download: ["pdf", "epub"]
    sharing:
      github: true
      facebook: false
      twitter: false

bookdown::pdf_book:
  latex_engine: xelatex
  keep_tex: true
  toc: true
  number_sections: true

bookdown::epub_book: default
